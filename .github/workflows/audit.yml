name: Dependency audit

# Deliberately not a pull-request check. An advisory is published against a
# package, not against a change, so a blocking audit turns somebody's unrelated
# PR red for something they did not do — and a check that goes red for reasons
# the author cannot fix is a check people learn to ignore. Weekly it is a
# notification instead, in the one place that is looking for it.
#
# Only the dependencies that ship are audited (--omit=dev): react, gsap and the
# Supabase client run in a visitor's browser, while eslint and prettier run on a
# laptop. Dependabot's security updates cover the dev side.
on:
  schedule:
    # Monday 05:00 UTC, after CodeQL's weekly run.
    - cron: '0 5 * * 1'
  workflow_dispatch:

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
      - name: Audit the dependencies that reach a browser
        run: npm audit --omit=dev --audit-level=high
