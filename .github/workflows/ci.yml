name: CI

on:
  # PRs are covered by the pull_request event; pushes only run on main so PRs
  # don't trigger two identical runs (push + pull_request) for the same commit.
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to avoid wasted parallel runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this workflow only needs to read the repo.
permissions:
  contents: read

jobs:
  check:
    # Two Node versions, because the two that matter disagree. 20 is the floor
    # this project has always supported and the only version CI used until now;
    # 24 is what it is developed on. The gap between them has already cost a red
    # main: `navigator` is a global from 21 onward, so code using it passed
    # every local run and failed here. Testing only 20 catches that one; testing
    # both also catches its mirror image — a change that is fine on 20 and
    # breaks the machine it was written on.
    #
    # Note on 20: the repo pins no Node version outside these workflows (no
    # .nvmrc, no `engines`, no NODE_VERSION), so which version Cloudflare Pages
    # actually builds with is set in the Pages dashboard and is not verifiable
    # from here. Do not drop 20 on the assumption that it is arbitrary — check
    # the Pages build settings first.
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '24']
    name: check (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a full commit SHA (supply-chain hardening); the
      # trailing comment records the human-readable version. Dependabot keeps
      # these SHAs updated via .github/dependabot.yml (github-actions ecosystem).
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck web
        run: npm run typecheck
      - name: Check formatting
        run: npm run format:check
      # Two test files (asset-versions, build-routes) each run `node build.mjs`,
      # which builds web/ itself when web/dist/ is missing. On a fresh checkout
      # both start that Vite build at once and race on emptying web/dist/
      # (ENOTEMPTY). Building web/ once here means neither has to.
      - name: Build web (once, before the tests)
        run: npm run build -w web
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  base:
    # A pull request into main moves caaciorg.com. Work is reviewed on preview
    # and reaches main as a release of everything preview already holds, so a
    # feature branch pointed straight at main is a mistake about which button
    # was clicked — and the cost of finding that out after the merge is a deploy
    # of something that was never on preview. hotfix/* is the way past this when
    # production is broken and preview is not where the fix can wait.
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      # github.head_ref is a branch name a contributor chose, so it is passed
      # through the environment and quoted — never interpolated into the script.
      - name: Only preview, release/* and hotfix/* may target main
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$HEAD_REF" in
            preview | release/* | hotfix/*)
              echo "$HEAD_REF -> main: allowed"
              ;;
            *)
              echo "::error::$HEAD_REF cannot be merged into main. Open this against preview instead; main takes preview, a release/* branch, or a hotfix/*."
              exit 1
              ;;
          esac
