name: Auth config

# Sign-in depends on configuration that lives in Supabase, not in this repo:
# which providers are enabled, the OAuth client ids, the Microsoft tenant
# endpoint, site_url and the redirect allow list. None of that is covered by the
# unit suite, and all of it can be changed from the dashboard without a commit —
# so this runs on a schedule as well as on pushes to main.
on:
  push:
    branches: [main]
  schedule:
    # 07:00 UTC daily — catches a dashboard change (or an expired setting) within
    # a day even when nobody has pushed.
    - cron: '0 7 * * *'
  workflow_dispatch:

concurrency:
  group: auth-config-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  auth-config:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to a full commit SHA (supply-chain hardening); the
      # trailing comment records the human-readable version, and Dependabot keeps
      # the SHAs current via .github/dependabot.yml.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci

      # The authorize checks need no credentials at all — /auth/v1/authorize is
      # public. The config checks additionally read the project settings over the
      # Management API; without SUPABASE_ACCESS_TOKEN they skip cleanly and the
      # job stays green, so a fork or an unconfigured repo does not go red.
      - name: Auth configuration contract
        env:
          CAACI_AUTH_CONFIG_TESTS: '1'
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node --test test/auth-config.test.js
