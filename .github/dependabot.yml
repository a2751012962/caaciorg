version: 2
updates:
  # Keep npm dev dependencies (eslint, prettier, wrangler) current.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      dev-dependencies:
        dependency-type: 'development'
  # Keep the SHA-pinned GitHub Actions current.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
