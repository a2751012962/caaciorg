<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login | Chinese American Association of Central Illinois</title>
    <!-- Standalone Tabler page (like /admin/). The literal token caaci-app.js in this
         comment opts the page out of build.mjs's mirror-enhancement injection — this
         page loads its own assets below and never runs the mirror layer. -->
    <link rel="stylesheet" href="/assets/tabler.min.css" />
    <style>
      /* Boxed layout — match the old site's 1080px content column. */
      .container-xl {
        max-width: 1080px;
      }

      /* Old-site (Divi) navigation look — white bar, hairline shadow, 14px/600
         links in soft black, current page in the red scheme color. */
      .caaci-sitenav {
        background: #fff;
        box-shadow: 0 1px 0 rgba(0, 0, 0, 0.1);
        min-height: 64px;
      }
      .caaci-sitenav .nav-link {
        font-family: 'Open Sans', Helvetica, Arial, sans-serif;
        font-size: 14px;
        font-weight: 600;
        color: rgba(0, 0, 0, 0.6);
        transition: opacity 0.4s ease-in-out;
      }
      .caaci-sitenav .nav-link:hover {
        color: rgba(0, 0, 0, 0.6);
        opacity: 0.7;
      }
      .caaci-sitenav .nav-link.active {
        color: #cd5c5c;
        box-shadow: none;
      }
    </style>
  </head>
  <body data-page="login">
    <div class="page">
      <!-- Site navigation — same menu as the mirrored site, plus language. -->
      <header class="navbar navbar-expand-md d-print-none caaci-sitenav">
        <div class="container-xl">
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#caaci-nav-menu"
            aria-controls="caaci-nav-menu"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <a href="/" class="navbar-brand pe-2" data-zh-href="/zh/">
            <img
              src="/wp-content/uploads/2025/01/CAACI-logo-1-e1737551037290.png"
              alt="Chinese American Association of Central Illinois"
              style="height: 48px; width: auto"
            />
          </a>
          <div class="collapse navbar-collapse" id="caaci-nav-menu">
            <ul class="navbar-nav">
              <li class="nav-item">
                <a class="nav-link" href="/" data-zh-href="/zh/" data-en="Welcome" data-zh="首页"
                  >Welcome</a
                >
              </li>
              <li class="nav-item">
                <a
                  class="nav-link"
                  href="/about/"
                  data-zh-href="/zh/about/"
                  data-en="About Us"
                  data-zh="关于我们"
                  >About Us</a
                >
              </li>
              <li class="nav-item">
                <a
                  class="nav-link"
                  href="/donate/"
                  data-zh-href="/zh/donate/"
                  data-en="Donate"
                  data-zh="捐赠"
                  >Donate</a
                >
              </li>
              <li class="nav-item">
                <a
                  class="nav-link"
                  href="/events/"
                  data-zh-href="/zh/events/"
                  data-en="Events"
                  data-zh="活动"
                  >Events</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link" href="/membership/" data-en="Membership" data-zh="会员"
                  >Membership</a
                >
              </li>
              <li class="nav-item">
                <a
                  class="nav-link"
                  href="/resources/"
                  data-zh-href="/zh/resources/"
                  data-en="Resources"
                  data-zh="资源"
                  >Resources</a
                >
              </li>
              <li class="nav-item">
                <a
                  class="nav-link"
                  href="/business-services/"
                  data-zh-href="/zh/business-services/"
                  data-en="Business Services"
                  data-zh="商家服务"
                  >Business Services</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link" href="/account/" data-en="My Account" data-zh="我的账户"
                  >My Account</a
                >
              </li>
            </ul>
            <div class="ms-auto d-flex align-items-center gap-2 mt-2 mt-md-0">
              <button type="button" class="btn btn-sm" id="caaci-lang">中文</button>
            </div>
          </div>
        </div>
      </header>

      <div class="container container-tight py-4">
        <div class="card card-md">
          <div class="card-body">
            <h2
              class="h2 text-center mb-4"
              data-en="Sign in to your account"
              data-zh="登录您的账户"
            >
              Sign in to your account
            </h2>
            <form id="caaci-login-form" novalidate>
              <div class="mb-3">
                <label class="form-label" data-en="Email address" data-zh="邮箱地址"
                  >Email address</label
                >
                <input
                  type="email"
                  id="caaci-li-email"
                  class="form-control"
                  autocomplete="username"
                  data-ph-en="you@example.com"
                  data-ph-zh="you@example.com"
                  placeholder="you@example.com"
                />
              </div>
              <div class="mb-2">
                <label class="form-label">
                  <span data-en="Password" data-zh="密码">Password</span>
                  <span class="form-label-description">
                    <a href="#" id="caaci-forgot" data-en="Forgot password?" data-zh="忘记密码？"
                      >Forgot password?</a
                    >
                  </span>
                </label>
                <input
                  type="password"
                  id="caaci-li-pwd"
                  class="form-control"
                  autocomplete="current-password"
                />
              </div>
              <div class="form-footer">
                <button
                  type="submit"
                  class="btn btn-primary w-100"
                  data-en="Sign in"
                  data-zh="登录"
                >
                  Sign in
                </button>
              </div>
            </form>
            <div class="hr-text" data-en="or continue with" data-zh="或使用以下方式登录">
              or continue with
            </div>
            <div class="row g-2" id="caaci-oauth-host"></div>
            <p class="alert mt-3 mb-0" id="caaci-login-notice" hidden></p>
          </div>
        </div>

        <div class="text-center text-secondary mt-3">
          <span data-en="New to CAACI?" data-zh="还没有账户？">New to CAACI?</span>
          <a href="#" id="caaci-show-signup" data-en="Create an account" data-zh="注册新账户"
            >Create an account</a
          >
        </div>

        <div class="card card-md mt-3" id="caaci-signup-card" hidden>
          <div class="card-body">
            <h2 class="h3 text-center mb-4" data-en="Create your account" data-zh="创建您的账户">
              Create your account
            </h2>
            <form id="caaci-signup-form" novalidate>
              <div class="mb-3">
                <label class="form-label" data-en="Full name" data-zh="姓名">Full name</label>
                <input type="text" id="caaci-su-name" class="form-control" autocomplete="name" />
              </div>
              <div class="mb-3">
                <label class="form-label" data-en="Email address" data-zh="邮箱地址"
                  >Email address</label
                >
                <input
                  type="email"
                  id="caaci-su-email"
                  class="form-control"
                  autocomplete="username"
                />
              </div>
              <div class="mb-3">
                <label class="form-label" data-en="Phone (optional)" data-zh="电话（可选）"
                  >Phone (optional)</label
                >
                <input type="tel" id="caaci-su-phone" class="form-control" autocomplete="tel" />
              </div>
              <div class="mb-3">
                <label
                  class="form-label"
                  data-en="Password (at least 8 characters)"
                  data-zh="密码（至少 8 位）"
                  >Password (at least 8 characters)</label
                >
                <input
                  type="password"
                  id="caaci-su-pwd"
                  class="form-control"
                  minlength="8"
                  autocomplete="new-password"
                />
              </div>
              <div class="mb-3">
                <label class="form-label" data-en="Confirm password" data-zh="确认密码"
                  >Confirm password</label
                >
                <input
                  type="password"
                  id="caaci-su-pwd2"
                  class="form-control"
                  autocomplete="new-password"
                />
              </div>
              <div class="form-footer">
                <button
                  type="submit"
                  id="caaci-su-submit"
                  class="btn btn-primary w-100"
                  data-en="Create account"
                  data-zh="创建账户"
                >
                  Create account
                </button>
              </div>
            </form>
            <p class="alert mt-3 mb-0" id="caaci-signup-notice" hidden></p>
            <p class="text-secondary text-center mt-3 mb-0">
              <span
                data-en="Ready to join? Pick a plan after signing up on the"
                data-zh="注册后即可在会员页面选择方案："
                >Ready to join? Pick a plan after signing up on the</span
              >
              <a href="/membership/" data-en="membership page" data-zh="会员页面"
                >membership page</a
              >
            </p>
          </div>
        </div>
      </div>
    </div>

    <script src="/assets/supabase.js"></script>
    <script src="/assets/caaci-config.js"></script>
    <script src="/assets/tabler.min.js" defer></script>
    <script type="module" src="/assets/caaci-member.js"></script>
  </body>
</html>
