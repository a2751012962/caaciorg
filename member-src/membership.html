<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Membership | Chinese American Association of Central Illinois</title>
    <!-- Standalone Tabler page (like /admin/). The literal token caaci-app.js in this
         comment opts the page out of build.mjs's mirror-enhancement injection — this
         page loads its own assets below and never runs the mirror layer. -->
    <link rel="stylesheet" href="/assets/tabler.min.css" />
  </head>
  <body class="layout-fluid" data-page="membership">
    <div class="page">
      <header class="navbar navbar-expand-md d-print-none" data-bs-theme="dark">
        <div class="container-xl">
          <a href="/" class="navbar-brand text-decoration-none">CAACI</a>
          <div class="navbar-nav flex-row align-items-center gap-2 ms-auto">
            <a href="/" class="nav-link px-2" data-en="Home" data-zh="首页">Home</a>
            <a href="/membership/" class="nav-link px-2 active" data-en="Membership" data-zh="会员"
              >Membership</a
            >
            <a href="/account/" class="nav-link px-2" data-en="My Account" data-zh="我的账户"
              >My Account</a
            >
            <button type="button" class="btn btn-sm btn-outline-light" id="caaci-lang">中文</button>
            <a
              href="/login-3/"
              class="btn btn-sm btn-outline-light"
              id="caaci-nav-auth"
              data-en="Sign in"
              data-zh="登录"
              >Sign in</a
            >
          </div>
        </div>
      </header>

      <div class="page-wrapper">
        <div class="page-header d-print-none">
          <div class="container-xl">
            <div class="subheader" data-en="Join the community" data-zh="加入社区">
              Join the community
            </div>
            <h1 class="page-title" data-en="CAACI Membership" data-zh="CAACI 会员">
              CAACI Membership
            </h1>
            <p
              class="text-secondary mt-1 mb-0"
              data-en="Annual membership supports our festivals, programs, and community services across Central Illinois."
              data-zh="年度会员支持我们在伊利诺伊州中部举办的节庆、项目和社区服务。"
            >
              Annual membership supports our festivals, programs, and community services.
            </p>
          </div>
        </div>
        <div class="page-body">
          <div class="container-xl">
            <div id="caaci-plans-you"></div>
            <div id="caaci-plans-discount"></div>
            <div class="row row-cards" id="caaci-plans-row"></div>
            <p
              class="text-secondary text-center mt-3"
              data-en="Prices include a 3.5% card-processing fee. Memberships renew yearly; cancel anytime from your account."
              data-zh="价格已含 3.5% 银行卡手续费。会员按年自动续费，可随时在账户中取消。"
            >
              Prices include a 3.5% card-processing fee.
            </p>
            <p class="alert m-0 mt-3" id="caaci-plans-notice" hidden></p>
          </div>
        </div>
      </div>
    </div>

    <div id="caaci-checkout-host"></div>

    <script src="/assets/supabase.js"></script>
    <script src="/assets/caaci-config.js"></script>
    <script type="module" src="/assets/caaci-member.js"></script>
  </body>
</html>
