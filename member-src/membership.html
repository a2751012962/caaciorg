<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Membership | Chinese American Association of Central Illinois</title>
    <!-- Standalone Tabler page (like /admin/). The literal token caaci-app.js in this
         comment opts the page out of build.mjs's mirror-enhancement injection — this
         page loads its own assets below and never runs the mirror layer. -->
    <link rel="stylesheet" href="/assets/tabler.min.css" />
    <!-- Shared CAACI layer. These pages opt out of build.mjs's injection loop,
         so the stylesheet has to be linked explicitly — without it the shared
         nav partial renders unstyled. -->
    <link rel="stylesheet" href="/assets/caaci-ui.css" />
    <style>
      /* Boxed layout — match the old site's 1080px content column. */
      .container-xl {
        max-width: 1080px;
      }

      /* Old-site (Divi) navigation look — white bar, hairline shadow, 14px/600
         links in soft black, current page in the red scheme color. */
      .caaci-sitenav {
        background: #fff;
        box-shadow: 0 1px 0 rgba(0, 0, 0, 0.1);
        min-height: 64px;
      }
      .caaci-sitenav .nav-link {
        font-family: 'Open Sans', Helvetica, Arial, sans-serif;
        font-size: 14px;
        font-weight: 600;
        color: rgba(0, 0, 0, 0.6);
        transition: opacity 0.4s ease-in-out;
      }
      .caaci-sitenav .nav-link:hover {
        color: rgba(0, 0, 0, 0.6);
        opacity: 0.7;
      }
      .caaci-sitenav .nav-link.active {
        color: #cd5c5c;
        box-shadow: none;
      }

      /* Brand hero band — matches the mirror's Divi hero (brick + gold rule). */
      .caaci-hero {
        background: linear-gradient(135deg, #8e2e11, #561100);
        border-bottom: 5px solid #edbb5f;
        color: #fff;
      }
      .caaci-hero .caaci-hero-eyebrow {
        color: #edbb5f;
        text-transform: uppercase;
        letter-spacing: 1px;
        font-size: 0.85rem;
        font-weight: 600;
      }
      .caaci-hero p {
        color: rgba(255, 255, 255, 0.85);
      }
    </style>
  </head>
  <body data-page="membership">
    <div class="page">
      <!--CAACI_NAV-->

      <!-- Hero -->
      <div class="caaci-hero d-print-none">
        <div class="container-xl py-5">
          <div class="caaci-hero-eyebrow mb-1" data-en="Join the community" data-zh="加入社区">
            Join the community
          </div>
          <h1 class="display-5 fw-bold mb-2" data-en="CAACI Membership" data-zh="CAACI 会员">
            CAACI Membership
          </h1>
          <p
            class="mb-0"
            data-en="Annual membership supports our festivals, programs, and community services across Central Illinois."
            data-zh="年度会员支持我们在伊利诺伊州中部举办的节庆、项目和社区服务。"
          >
            Annual membership supports our festivals, programs, and community services.
          </p>
        </div>
      </div>

      <div class="page-wrapper">
        <div class="page-body">
          <div class="container-xl">
            <div id="caaci-plans-you"></div>
            <div id="caaci-plans-discount"></div>
            <!-- Placeholder cards. Tiers are fetched from Supabase with a 3.5s
                 timeout before falling back to the built-in catalogue, so
                 without these the page shows several seconds of empty space.
                 caaci-member.js replaces the whole row once tiers resolve. -->
            <div class="row row-cards" id="caaci-plans-row" aria-busy="true">
              <div class="col-sm-6 col-lg-3">
                <div class="card placeholder-glow">
                  <div class="card-body text-center">
                    <div class="placeholder col-6 mb-3"></div>
                    <div class="placeholder col-9 mb-2"></div>
                    <div class="placeholder col-5 mb-3"></div>
                    <div class="placeholder col-12"></div>
                  </div>
                </div>
              </div>
              <div class="col-sm-6 col-lg-3">
                <div class="card placeholder-glow">
                  <div class="card-body text-center">
                    <div class="placeholder col-6 mb-3"></div>
                    <div class="placeholder col-9 mb-2"></div>
                    <div class="placeholder col-5 mb-3"></div>
                    <div class="placeholder col-12"></div>
                  </div>
                </div>
              </div>
              <div class="col-sm-6 col-lg-3">
                <div class="card placeholder-glow">
                  <div class="card-body text-center">
                    <div class="placeholder col-6 mb-3"></div>
                    <div class="placeholder col-9 mb-2"></div>
                    <div class="placeholder col-5 mb-3"></div>
                    <div class="placeholder col-12"></div>
                  </div>
                </div>
              </div>
              <div class="col-sm-6 col-lg-3">
                <div class="card placeholder-glow">
                  <div class="card-body text-center">
                    <div class="placeholder col-6 mb-3"></div>
                    <div class="placeholder col-9 mb-2"></div>
                    <div class="placeholder col-5 mb-3"></div>
                    <div class="placeholder col-12"></div>
                  </div>
                </div>
              </div>
            </div>
            <p
              class="text-secondary text-center mt-3"
              data-en="Prices include a 3.5% card-processing fee. Memberships renew yearly; cancel anytime from your account."
              data-zh="价格已含 3.5% 银行卡手续费。会员按年自动续费，可随时在账户中取消。"
            >
              Prices include a 3.5% card-processing fee.
            </p>
            <p class="alert m-0 mt-3" id="caaci-plans-notice" role="alert" hidden></p>
          </div>
        </div>
      </div>
    </div>

    <div id="caaci-checkout-host"></div>

    <script src="/assets/supabase.js"></script>
    <script src="/assets/caaci-config.js"></script>
    <script src="/assets/tabler.min.js" defer></script>
    <script type="module" src="/assets/caaci-member.js"></script>
  </body>
</html>
