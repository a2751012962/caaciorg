<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Account | Chinese American Association of Central Illinois</title>
    <!-- Standalone Tabler page (like /admin/). The literal token caaci-app.js in this
         comment opts the page out of build.mjs's mirror-enhancement injection — this
         page loads its own assets below and never runs the mirror layer. -->
    <link rel="stylesheet" href="/assets/tabler.min.css" />
    <style>
      /* Brand hero band — matches the mirror's Divi hero (brick + gold rule). */
      .caaci-hero {
        background: linear-gradient(135deg, #8e2e11, #561100);
        border-bottom: 5px solid #edbb5f;
        color: #fff;
      }
      .caaci-hero .caaci-hero-eyebrow {
        color: #edbb5f;
        text-transform: uppercase;
        letter-spacing: 1px;
        font-size: 0.85rem;
        font-weight: 600;
      }
      /* The digital membership card — brand look, shown at partner businesses. */
      .caaci-mcard2 {
        max-width: 460px;
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid var(--tblr-border-color);
        box-shadow: var(--tblr-shadow-card, 0 2px 8px rgba(0, 0, 0, 0.08));
        background: #fff;
      }
      .caaci-mcard2-head {
        background: #8e2e11;
        border-bottom: 5px solid #edbb5f;
        color: #fff;
        padding: 12px 18px;
        display: flex;
        align-items: baseline;
        gap: 10px;
      }
      .caaci-mcard2-head b {
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 26px;
        letter-spacing: 1px;
      }
      .caaci-mcard2-head span {
        font-size: 11px;
        opacity: 0.9;
      }
      .caaci-mcard2-body {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 12px;
        padding: 18px;
      }
      .caaci-mcard2-qr img {
        width: 108px;
        height: 108px;
        image-rendering: pixelated;
      }
    </style>
  </head>
  <body class="layout-fluid" data-page="account">
    <div class="page">
      <!-- Site navigation — same menu as the mirrored site, plus language + auth. -->
      <header class="navbar navbar-expand-md d-print-none">
        <div class="container-xl">
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#caaci-nav-menu"
            aria-controls="caaci-nav-menu"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <a href="/" class="navbar-brand pe-2" data-zh-href="/zh/">
            <img
              src="/wp-content/uploads/2025/01/CAACI-logo-1-e1737551037290.png"
              alt="Chinese American Association of Central Illinois"
              style="height: 42px; width: auto"
            />
          </a>
          <div class="collapse navbar-collapse" id="caaci-nav-menu">
            <ul class="navbar-nav">
              <li class="nav-item">
                <a class="nav-link" href="/" data-zh-href="/zh/" data-en="Welcome" data-zh="首页"
                  >Welcome</a
                >
              </li>
              <li class="nav-item">
                <a
                  class="nav-link"
                  href="/about/"
                  data-zh-href="/zh/about/"
                  data-en="About Us"
                  data-zh="关于我们"
                  >About Us</a
                >
              </li>
              <li class="nav-item">
                <a
                  class="nav-link"
                  href="/donate/"
                  data-zh-href="/zh/donate/"
                  data-en="Donate"
                  data-zh="捐赠"
                  >Donate</a
                >
              </li>
              <li class="nav-item">
                <a
                  class="nav-link"
                  href="/events/"
                  data-zh-href="/zh/events/"
                  data-en="Events"
                  data-zh="活动"
                  >Events</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link" href="/membership/" data-en="Membership" data-zh="会员"
                  >Membership</a
                >
              </li>
              <li class="nav-item">
                <a
                  class="nav-link"
                  href="/resources/"
                  data-zh-href="/zh/resources/"
                  data-en="Resources"
                  data-zh="资源"
                  >Resources</a
                >
              </li>
              <li class="nav-item">
                <a
                  class="nav-link"
                  href="/business-services/"
                  data-zh-href="/zh/business-services/"
                  data-en="Business Services"
                  data-zh="商家服务"
                  >Business Services</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link active" href="/account/" data-en="My Account" data-zh="我的账户"
                  >My Account</a
                >
              </li>
            </ul>
            <div class="ms-auto d-flex align-items-center gap-2 mt-2 mt-md-0">
              <button type="button" class="btn btn-sm" id="caaci-lang">中文</button>
              <a
                href="/login-3/"
                class="btn btn-sm btn-primary"
                id="caaci-nav-auth"
                data-en="Sign in"
                data-zh="登录"
                >Sign in</a
              >
            </div>
          </div>
        </div>
      </header>

      <!-- Hero -->
      <div class="caaci-hero d-print-none">
        <div class="container-xl py-4">
          <div class="caaci-hero-eyebrow mb-1" data-en="Membership" data-zh="会员">Membership</div>
          <h1 class="display-6 fw-bold mb-0" data-en="My Account" data-zh="我的账户">My Account</h1>
        </div>
      </div>

      <div class="page-wrapper">
        <div class="page-body">
          <div class="container-xl">
            <div id="caaci-recovery-host"></div>
            <div id="caaci-account-host">
              <div class="card">
                <div class="card-body">
                  <p class="text-secondary mb-0" data-en="Loading…" data-zh="加载中…">Loading…</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="/assets/supabase.js"></script>
    <script src="/assets/caaci-config.js"></script>
    <script src="/assets/qrcode.js"></script>
    <script src="/assets/tabler.min.js" defer></script>
    <script type="module" src="/assets/caaci-member.js"></script>
  </body>
</html>
