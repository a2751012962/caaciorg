# Pages project name — the deploy target for `npm run deploy` and the
# `--project-name` for secret commands. The one Pages project is `caaci`
# (Git-connected); caaci-8s2.pages.dev is only its pages.dev subdomain, not a
# separate project.
name = "caaci"
compatibility_date = "2024-11-01"
pages_build_output_dir = "dist"

# Public, browser-safe config — declared here as PLAINTEXT vars (NOT secrets).
# This is a wrangler.toml-managed Pages project, so the dashboard env UI is locked
# to "Secrets only"; plaintext variables must be declared here, and the Git build
# applies them to the Pages Functions runtime. The Supabase anon key is public by
# design (Row Level Security, not secrecy, protects the data) and is already shipped
# to every browser, so it is safe to commit. (build.mjs also hardcodes these same
# values as defaults for the browser bundle dist/assets/caaci-config.js.)
[vars]
SUPABASE_URL = "https://wslzeqhipvibeflmxznh.supabase.co"
SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndzbHplcWhpcHZpYmVmbG14em5oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3NTA2NDAsImV4cCI6MjEwNDMyNjY0MH0.kQ0LZ-O2jVxnPaW-S9cAIeYFFTgrbb_ddXDJSzfrkXc"
# Sender for the site's own emails (registration confirmations, contact form,
# news) — the same verified caaciorg.com sender Supabase Auth uses over Resend.
# Not a secret. Without it (or without the RESEND_API_KEY secret) sendEmail in
# functions/api/_lib.js silently sends nothing.
NOTIFY_FROM = "CAACI <no-reply@caaciorg.com>"
# Staff inbox for notifications that have no explicit recipient (contact form,
# business listings) and the reply-to on registration confirmations. Without it
# those staff emails are skipped even when RESEND_API_KEY and NOTIFY_FROM are set.
NOTIFY_TO = "caaci.org@gmail.com"

# Secrets are NOT stored here — set them with wrangler (production by default;
# secrets are per environment). The argument after `put` is the NAME below; the
# value is pasted at the prompt that follows, never typed on the command line:
#   npx wrangler pages secret put SUPABASE_SERVICE_ROLE_KEY --project-name=caaci
#   npx wrangler pages secret put STRIPE_SECRET_KEY         --project-name=caaci
#   npx wrangler pages secret put STRIPE_WEBHOOK_SECRET     --project-name=caaci
#   npx wrangler pages secret put RESEND_API_KEY            --project-name=caaci
# Preview only (value 1): Compose News refuses real sends, test sends still work:
#   npx wrangler pages secret put NEWS_TEST_ONLY --project-name=caaci --env preview
# NOTE: SUPABASE_URL / SUPABASE_ANON_KEY must NOT also exist as secrets — a secret
# shadows the [vars] value of the same name. They were removed as secrets so the
# plaintext vars above are authoritative.
#
# Server-side env (Pages Functions) needs:
#   SUPABASE_URL, SUPABASE_ANON_KEY (plaintext above), SUPABASE_SERVICE_ROLE_KEY,
#   STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, RESEND_API_KEY, NOTIFY_FROM, NOTIFY_TO
